name: Check installer
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install shell validation dependency
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends --yes zsh
      - run: bash -n install.sh
      - run: python -m unittest discover -s tests -v
      - run: sh -n session/xinitrc
      - name: Test bundled chthm
        working-directory: vendor/chthm
        run: PYTHONPATH=src python -m unittest discover -s tests -v
